<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" aria-labelledby="t d" role="img" viewBox="0 0 1160 470"><title id="t">Supported sources and data formats</title><desc id="d">S3 and local files, PostgreSQL, Athena (read only) and Kafka (write only) around the dynamicio layer; parquet, hdf5, json and csv formats.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Helvetica,Arial,sans-serif;fill:#f1f5f9}.flow{stroke-dasharray:7 6;animation:dash 1.4s linear infinite}@media (prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#94a3b8" d="M0 0L10 5L0 10z"/></marker><marker id="ag" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#2dd4bf" d="M0 0L10 5L0 10z"/></marker><marker id="as" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#e25444" d="M0 0L10 5L0 10z"/></marker><marker id="ak" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#e0a526" d="M0 0L10 5L0 10z"/></marker><marker id="ap" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#4f86c6" d="M0 0L10 5L0 10z"/></marker><marker id="at" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a78bfa" d="M0 0L10 5L0 10z"/></marker></defs><rect width="1160" height="470" fill="#0f172a" rx="16"/><text x="580" y="40" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">One interface for every source and sink</text><text x="580" y="62" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="middle">pandas DataFrames in and out, driven by YAML resource definitions</text><text x="40" y="104" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="start">READ FROM</text><text x="1120" y="104" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="end">WRITE TO</text><rect width="330" height="74" x="40" y="120" fill="#1e293b" stroke="#e25444" stroke-width="2" rx="12"/><rect width="4" height="46" x="50" y="134" fill="#e25444" rx="2"/><g transform="translate(76,157.0) scale(1.0)"><path fill="#e25444" fill-opacity=".25" stroke="#e25444" stroke-width="3" d="M-17 -12 L-12 16 Q0 22 12 16 L17 -12"/><ellipse cx="0" cy="-12" fill="#e25444" fill-opacity=".5" stroke="#e25444" stroke-width="3" rx="17" ry="6"/></g><text x="108" y="155" fill="#f1f5f9" font-size="15" font-weight="700" text-anchor="start">Amazon S3 · local files</text><text x="108" y="174" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">s3 · s3_path_prefix · local</text><rect width="71.6" height="22" x="327.6" y="109" fill="#e25444" stroke="#e25444" stroke-width="0" rx="11"/><text x="363.4" y="124" fill="#0b1220" font-size="11" font-weight="700" text-anchor="middle">IN / OUT</text><rect width="330" height="74" x="40" y="212" fill="#1e293b" stroke="#4f86c6" stroke-width="2" rx="12"/><rect width="4" height="46" x="50" y="226" fill="#4f86c6" rx="2"/><g fill="#4f86c6" fill-opacity=".25" stroke="#4f86c6" stroke-width="3" transform="translate(76,249.0) scale(1.0)"><path d="M-15 -12 V12 Q0 22 15 12 V-12"/><ellipse cx="0" cy="-12" fill-opacity=".5" rx="15" ry="6"/><path fill="none" d="M-15 0 Q0 10 15 0"/></g><text x="108" y="247" fill="#f1f5f9" font-size="15" font-weight="700" text-anchor="start">PostgreSQL</text><text x="108" y="266" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">SQLAlchemy · psycopg2</text><rect width="71.6" height="22" x="327.6" y="201" fill="#4f86c6" stroke="#4f86c6" stroke-width="0" rx="11"/><text x="363.4" y="216" fill="#0b1220" font-size="11" font-weight="700" text-anchor="middle">IN / OUT</text><rect width="330" height="74" x="40" y="304" fill="#1e293b" stroke="#a78b