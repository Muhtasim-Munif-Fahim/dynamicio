one block per environment</text><rect width="248" height="40" x="456" y="232" fill="#0f172a" stroke="#334155" stroke-width="1" rx="8"/><text x="470" y="249" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="start">schema</text><text x="470" y="265" fill="#94a3b8" font-size="11" font-weight="400" text-anchor="start">Pandera: dtypes + validations</text><rect width="248" height="40" x="456" y="278" fill="#0f172a" stroke="#334155" stroke-width="1" rx="8"/><text x="470" y="295" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="start">metrics</text><text x="470" y="311" fill="#94a3b8" font-size="11" font-weight="400" text-anchor="start">min, max, mean, counts as JSON logs</text><rect width="248" height="40" x="456" y="324" fill="#0f172a" stroke="#334155" stroke-width="1" rx="8"/><text x="470" y="341" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="start">same code everywhere</text><text x="470" y="357" fill="#94a3b8" font-size="11" font-weight="400" text-anchor="start">LOCAL, DEV and PROD</text><path fill="none" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#ag)" d="M374 157.0 H436" class="flow"/><path fill="none" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#ag)" d="M724 157.0 H786" class="flow"/><path fill="none" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#ag)" d="M374 249.0 H436" class="flow"/><path fill="none" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#ag)" d="M724 249.0 H786" class="flow"/><path fill="none" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#ag)" d="M374 341.0 H436" class="flow"/><path fill="none" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#ag)" d="M724 341.0 H786" class="flow"/><text x="40" y="425" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="start">FILE FORMATS</text><rect width="74" height="22" x="160" y="410" fill="#38bdf8" stroke="#38bdf8" stroke-width="0" rx="11"/><text x="197" y="425" fill="#0b1220" font-size="11" font-weight="700" text-anchor="middle"