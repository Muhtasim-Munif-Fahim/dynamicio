<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="250" aria-labelledby="t d" role="img" viewBox="0 0 1160 250"><title id="t">Supported file formats</title><desc id="d">parquet, hdf5, json and csv, with the options pandas takes for each.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Helvetica,Arial,sans-serif;fill:#f1f5f9}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#94a3b8" d="M0 0L10 5L0 10z"/></marker><marker id="ag" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#2dd4bf" d="M0 0L10 5L0 10z"/></marker><marker id="as" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#e25444" d="M0 0L10 5L0 10z"/></marker><marker id="ak" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#e0a526" d="M0 0L10 5L0 10z"/></marker><marker id="ap" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#4f86c6" d="M0 0L10 5L0 10z"/></marker><marker id="at" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a78bfa" d="M0 0L10 5L0 10z"/></marker></defs><rect width="1160" height="250" fill="#0f172a" rx="16"/><text x="580" y="36" fill="#f1f5f9" font-size="17" font-weight="700" text-anchor="middle">Each format has its own kwargs. dynamicio keeps them in the resource definition.</text><rect width="262" height="160" x="24" y="62" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="14"/><rect width="84" height="28" x="40" y="80" fill="#38bdf8" stroke="#38bdf8" stroke-width="0" rx="14"/><text x="82" y="99" fill="#0b1220" class="m" font-size="14" font-weight="800" text-anchor="middle">parquet</text><text x="42" y="138" fill="#cbd5e1" class="m" font-size="12" font-weight="400" text-anchor="start">engine: pyarrow | fastparquet</text><text x="42" y="162" fill="#cbd5e1" class="m" font-size="12" font-weight="400" text-anchor="start">compression, columns, filters</text><text x="42" y="206" fill="#94a3b8" font-size="11.5" font-weight="400" text-anchor="start">S3 · local</text><rect width="262" height="160" x="306" y="62" fill="#1e293b" stroke="#22c55e" stroke-width="2" rx="14"/><rect width="84" height="28" x="322" y="80" fill="#22c55e" stroke="#22c55e" stroke-width="0" rx="14"/><text x="364" y="99" fill="#0b1220" class="m" font-size="14" font-weight="800" text-anchor="middle">hdf5</text><text x="324" y="138" fill="#cbd5e1" class="m" font-size="12" font-weight="400" text-anchor="start">file_type: hdf | h5</text><text x="324" y="162" fill="#cbd5e1" class="m" font-size="12" font-weight="400" text-anchor="start">PyTables, stored under key df</text><text x="324" y="206" fill="#94a3b8" font-size="11.5" font-weight="400" text-anchor="start">S3 · local</text><rect width="262" height="160" x="588" y="62" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="14"/><rect width="84" height="28" x="604" y="80" fill="#f59e0b" stroke="#f59e0b" stroke-width="0" rx="14"/><text x="646" y="99" fill="#0b1220" class="m" font-size="14" font-weight="800" text-anchor="middle">json</text><text x="606" y="138" fill="#cbd5e1" class="m" font-size="12" font-weight="400" text-anchor="start">orient: columns | records | ...</text><text x="606" y="162" fill="#cbd5e1" class="m" font-size="12" font-weight="400" text-anchor="start">lines, index follow pandas</text><text x="606" y="206" fill="#94a3b8" font-size="11.5" font-weight="400" text-anchor="start">S3 · local</text><rect width="262" height="160" x="870" y="62" fill="#1e293b" stroke="#a3e635" stroke-width="2" rx="14"/><rect width="84" height="28" x="886" y="80" fill="#a3e635" stroke="#a3e635" stroke-width="0" rx="14"/><text x="928" y="99" fill="#0b1220" class="m" font-size="14" font-weight="800" text-anchor="middle">csv</text><text x="888" y="138" fill="#cbd5e1" class="m" font-size="12" font-weight="400" text-anchor="start">sep, dtype, parse_dates</text><text x="888" y="162" fill="#cbd5e1" class="m" font-size="12" font-weight="400" text-anchor="start">index_col, usecols, nrows</text><text x="888" y="206" fill="#94a3b8" font-size="11.5" font-weight="400" text-anchor="start">S3 · local</text></svg>