<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" aria-labelledby="t d" role="img" viewBox="0 0 1200 560"><title id="t">Sample dynamicio pipeline in an Airflow DAG</title><desc id="d">FOO from S3 and BAR from Postgres feed the staging task, which writes staged parquet to S3; the transform task reads it and writes FINAL_FOO to S3 and FINAL_BAR to Kafka.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Helvetica,Arial,sans-serif;fill:#f1f5f9}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.flow{stroke-dasharray:7 6;animation:dash 1.4s linear infinite}@media (prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#94a3b8" d="M0 0L10 5L0 10z"/></marker><marker id="ag" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#2dd4bf" d="M0 0L10 5L0 10z"/></marker><marker id="as" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#e25444" d="M0 0L10 5L0 10z"/></marker><marker id="ak" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#e0a526" d="M0 0L10 5L0 10z"/></marker><marker id="ap" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#4f86c6" d="M0 0L10 5L0 10z"/></marker><marker id="at" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a78bfa" d="M0 0L10 5L0 10z"/></marker></defs><rect width="1200" height="560" fill="#0f172a" rx="16"/><rect width="700" height="424" x="250" y="24" fill="#0b1b33" stroke="#38bdf8" stroke-width="2" rx="18"/><g transform="translate(282,56) scale(1.1)"><path fill="#38bdf8" d="M0 0 L0 -15 A15 15 0 0 1 13.0 -7.5z" transform="rotate(0)"/><path fill="#017cee" d="M0 0 L0 -15 A15 15 0 0 1 13.0 -7.5z" transform="rotate(72)"/><path fill="#38bdf8" d="M0 0 L0 -15 A15 15 0 0 1 13.0 -7.5z" transform="rotate(144)"/><path fill="#017cee" d="M0 0 L0 -15 A15 15 0 0 1 13.0 -7.5z" transform="rotate(216)"/><path fill="#38bdf8" d="M0 0 L0 -15 A15 15 0 0 1 13.0 -7.5z" transform="rotate(288)"/><circle r="3" fill="#0f172a"/></g><text x="308" y="62" fill="#38bdf8" font-size="16" font-weight="700" text-anchor="start">Airflow DAG</text><text x="420" y="62" fill="#f1f5f9" class="m" font-size="15" font-weight="700" text-anchor="start">foo_bar_pipeline</text><rect width="170" height="92" x="300" y="150" fill="#052e16" stroke="#22c55e" stroke-width="3" rx="10"/><text x="385" y="188" fill="#f1f5f9" class="m" font-size="20" font-weight="800" text-anchor="middle">staging</text><text x="385" y="212" fill="#86efac" font-size="11" font-weight="600" text-anchor="middle">success · PythonOperator</text><circle cx="316" cy="166" r="5" fill="#22c55e"/><rect width="170" height="92" x="720" y="150" fill="#052e16" stroke="#22c55e" stroke-width="3" rx="10"/><text x="805" y="188" fill="#f1f5f9" class="m" font-size="20" font-weight="800" text-anchor="middle">transform</text><text x="805" y="212" fill="#86efac" font-size="11" font-weight="600" text-anchor="middle">success · PythonOperator</text><circle cx="736" cy="166" r="5" fill="#22c55e"/><path fill="none" stroke="#22c55e" stroke-width="2.2" marker-end="url(#ag)" d="M470 196 H716" class="flow"/><text x="593" y="186" fill="#94a3b8" font-size="11" font-weight="400" text-anchor="middle">task order</text><rect width="336" height="74" x="432" y="338" fill="#1e293b" stroke="#e25444" stroke-width="2" rx="12"/><rect width="4" height="46" x="442" y="352" fill="#e25444" rx="2"/><g transform="translate(468,375.0) scale(1.0)"><path fill="#e25444" fill-opacity=".25" stroke="#e25444" stroke-width="3" d="M-17 -12 L-12 16 Q0 22 12 16 L17 -12"/><ellipse cx="0" cy="-12" fill="#e25444" fill-opacity=".5" stroke="#e25444" stroke-width="3" rx="17" ry="6"/></g><text x="500" y="373" fill="#f1f5f9" font-size="15" font-weight="700" text-anchor="start">STAGED_FOO · STAGED_BAR</text><text x="500" y="392" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">s3 · parquet · intermediate</text><path fill="none" stroke="#e25444" stroke-width="2.2" marker-end="url(#as)" d="M385 246 C385 330 400 375 428 375" class="flow"/><path fill="none" stroke="#e25444" stroke-width="2.2" marker-end="url(#as)" d="M772 375 C805 375 805 290 805 250" class="flow"/><text x="300" y="336" fill="#e25444" class="m" font-size="12" font-weight="700" text-anchor="start">.write()</text><text x="814" y="300" fill="#e25444" class="m" font-size="12" font-weight="700" text-anchor="start">.read()</text><text x="24" y="120" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="start">INPUTS</text><text x="1176" y="120" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="end">OUTPUTS</text><rect width="190" height="74" x="24" y="140" fill="#1e293b" stroke="#e25444" stroke-width="2" rx="12"/><rect width="4" height="46" x="34" y="154" fill="#e25444" rx="2"/><g transform="translate(60,177.0) scale(1.0)"><path fill="#e25444" fill-opacity=".25" stroke="#e25444" stroke-width="3" d="M-17 -12 L-12 16 Q0 22 12 16 L17 -12"/><ellipse cx="0" cy="-12" fill="#e25444" fill-opacity=".5" stroke="#e25444" stroke-width="3" rx="17" ry="6"/></g><text x="92" y="175" fill="#f1f5f9" font-size="15" font-weight="700" text-anchor="start">FOO</text><text x="92" y="194" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">s3 · hdf</text><rect width="190" height="74" x="24" y="240" fill="#1e293b" stroke="#4f86c6" stroke-width="2" rx="12"/><rect width="4" height="46" x="34" y="254" fill="#4f86c6" rx="2"/><g fill="#4f86c6" fill-opacity=".25" stroke="#4f86c6" stroke-width="3" transform="translate(60,277.0) scale(1.0)"><path d="M-15 -12 V12 Q0 22 15 12 V-12"/><ellipse cx="0" cy="-12" fill-opacity=".5" rx="15" ry="6"/><path fill="none" d="M-15 0 Q0 10 15 0"/></g><text x="92" y="275" fill="#f1f5f9" font-size="15" font-weight="700" text-anchor="start">BAR</text><text x="92" y="294" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">postgres · table</text><path fill="none" stroke="#e25444" stroke-width="2.2" marker-end="url(#as)" d="M218 177 C240 177 250 190 296 196" class="flow"/><path fill="none" stroke="#4f86c6" stroke-width="2.2" marker-end="url(#ap)" d="M218 277 C250 277 255 230 296 215" class="flow"/><text x="24" y="350" fill="#94a3b8" font-size="11" font-weight="400" text-anchor="start">.read() validates the schema</text><text x="24" y="368" fill="#94a3b8" font-size="11" font-weight="400" text-anchor="start">and logs metrics per column</text><rect width="190" height="74" x="986" y="140" fill="#1e293b" stroke="#e25444" stroke-width="2" rx="12"/><rect width="4" height="46" x="996" y="154" fill="#e25444" rx="2"/><g transform="translate(1022,177.0) scale(1.0)"><path fill="#e25444" fill-opacity=".25" stroke="#e25444" stroke-width="3" d="M-17 -12 L-12 16 Q0 22 12 16 L17 -12"/><ellipse cx="0" cy="-12" fill="#e25444" fill-opacity=".5" stroke="#e25444" stroke-width="3" rx="17" ry="6"/></g><text x="1054" y="175" fill="#f1f5f9" font-size="15" font-weight="700" text-anchor="start">FINAL_FOO</text><text x="1054" y="194" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">s3 · parquet</text><rect width="190" height="74" x="986" y="240" fill="#1e293b" stroke="#e0a526" stroke-width="2" rx="12"/><rect width="4" height="46" x="996" y="254" fill="#e0a526" rx="2"/><g fill="none" stroke="#e0a526" stroke-width="3" transform="translate(1022,277.0) scale(1.0)"><circle r="6"/><path d="M0 -6 V-14 M5 3 L12 8 M-5 3 L-12 8 M6 -2 L14 -6"/><circle cx="0" cy="-18" r="4"/><circle cx="15" cy="-7" r="4"/><circle cx="14" cy="11" r="4"/><circle cx="-14" cy="11" r="4"/></g><text x="1054" y="275" fill="#f1f5f9" font-size="15" font-weight="700" text-anchor="start">FINAL_BAR</text><text x="1054" y="294" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">kafka topic</text><path fill="none" stroke="#e25444" stroke-width="2.2" marker-end="url(#as)" d="M894 196 C940 196 940 177 982 177" class="flow"/><path fill="none" stroke="#e0a526" stroke-width="2.2" marker-end="url(#ak)" d="M894 210 C940 215 945 277 982 277" class="flow"/><rect width="1152" height="60" x="24" y="476" fill="#0f172a" stroke="#334155" stroke-width="1" rx="10"/><text x="44" y="502" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="start">Same runner code in every environment:</text><text x="44" y="522" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">ENVIRONMENT=LOCAL reads tests/data, CLOUD reads S3 and Postgres. Only the resource definitions change.</text></svg>